<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Historia Clínica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Historia Clínica Familiar</title>
<style>
:root{--bg:#f4f6f7;--panel:#fff;--ink:#1b2a30;--muted:#5f7178;--line:#dde4e7;--accent:#0f766e;--accent-2:#e3f1ef;--danger:#b42318;--warn:#b54708;--warn-bg:#fff6e5;--chip:#eef2f4;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1416;--panel:#172024;--ink:#e6edef;--muted:#94a5ab;--line:#26343a;--accent:#2bb3a6;--accent-2:#163331;--danger:#f97066;--warn:#fdb022;--warn-bg:#2e2410;--chip:#1f2b30;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto;min-width:0;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.sync.ok{color:var(--accent)}
.sync.pending{color:var(--warn)}
.sync.error{color:var(--danger)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px 10px}
#members{display:flex;flex-direction:column;gap:4px}
.mem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:11px;cursor:pointer}
.mem:hover{background:var(--panel)}
.mem.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.mem.addm{border:1px dashed var(--line);justify-content:center;color:var(--accent);font-weight:600;margin-top:6px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.av.all{background:var(--accent)}
.av.lg{width:58px;height:58px;font-size:21px}
.mi{display:flex;flex-direction:column;min-width:0}
.mi b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{color:var(--muted);font-size:12px}
.note{font-size:12.5px;color:var(--muted);margin:18px 10px 0;line-height:1.5}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;line-height:1.2}
.ph p{margin:2px 0 0}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0 0}
.facts>div{background:var(--chip);border-radius:10px;padding:9px 12px}
.facts dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.facts dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-size:16px;margin-right:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;min-width:0;font-size:16px}
.tools input{flex:1 1 220px}
.tools select{flex:0 1 220px}
.year{margin:10px 4px 2px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.05em}
#visitList{display:flex;flex-direction:column;gap:10px}
.visit{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.vh{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer}
.vd{flex:none;width:56px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.vd b{display:block;font-size:22px;line-height:1}
.vd span{font-size:12px;color:var(--muted);text-transform:uppercase}
.vb{flex:1;min-width:0}
.vt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spec{font-weight:700}
.who{font-size:12px;background:var(--accent-2);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:600}
.vs{font-size:13.5px;color:var(--muted);margin-top:1px}
.vr{font-size:13.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc{flex:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.vc .chev{transition:transform .15s}
.visit.open .chev{transform:rotate(180deg)}
.vbody{display:none;border-top:1px solid var(--line);padding:14px 16px 16px}
.visit.open .vbody{display:block}
.vf{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 20px;margin:0 0 14px}
.vf dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.vf dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.cat{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
select.cat{border:0;cursor:pointer;font-size:13px}
.dn{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz{font-size:12px;color:var(--muted)}
.vacts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.empty{text-align:center;padding:48px 20px}
.empty h2{margin:0 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:440px}
.nores{color:var(--muted);text-align:center;padding:30px 10px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,24,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border-radius:16px;width:100%;max-width:700px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg form,.dlg .wrap{display:flex;flex-direction:column;min-height:0;flex:1}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px}
.x{margin-left:auto;background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.mb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.mf{display:flex;gap:8px;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.mb label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.mb input,.mb select,.mb textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-weight:400;color:var(--ink);width:100%;min-width:0;font-size:16px}
.mb input[type=date]{min-height:42px}
.mb textarea{resize:vertical}
.mb input:focus,.mb select:focus,.mb textarea:focus,.tools input:focus,.tools select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.docbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.docbox legend{font-weight:700;font-size:13px;padding:0 6px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.btn.add{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0}
#draftDocs .doc{margin-top:6px}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sec h3{margin:0 0 6px;font-size:15px}
.sec p{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stepn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;margin-right:6px}
.step{margin-top:12px}
.step>b{display:flex;align-items:center;font-size:14px}
.okline{color:var(--accent);font-weight:600}
.errline{color:var(--danger);font-size:13px;margin-top:6px;word-break:break-word}
details.help{font-size:13.5px;margin-top:10px}
details.help summary{cursor:pointer;color:var(--accent);font-weight:600}
details.help ol{padding-left:20px;margin:8px 0}
details.help li{margin:4px 0}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.err{background:var(--warn-bg);color:var(--warn);padding:12px 16px;border-radius:10px}
/* Panel izquierdo fijo + calendario */
aside{position:sticky;top:calc(var(--toph,62px) + 22px);align-self:start;max-height:calc(100vh - var(--toph,62px) - 30px);overflow:auto;scrollbar-width:thin;padding-bottom:10px}
.calwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;margin-top:18px;box-shadow:var(--shadow)}
.calwrap>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;cursor:default}
.calwrap>summary::-webkit-details-marker{display:none}
.calwrap>summary .cnt{font-size:12px;background:var(--accent-2);color:var(--accent);border-radius:20px;padding:1px 8px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-weight:600;font-size:13.5px;text-transform:capitalize}
.calh button{border:0;background:none;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:18px}
.calh button:hover{background:var(--chip);color:var(--accent)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px;margin-top:6px}
.calg .wd{color:var(--muted);font-size:10.5px;font-weight:700;padding:2px 0}
.calg .d{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;border:0;background:none;padding:0;font-size:12.5px;color:var(--ink)}
.calg .d.out{opacity:.3}
.calg .d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.calg .d.has{background:var(--accent-2);color:var(--accent);font-weight:700;cursor:pointer}
.calg .d.has.past{opacity:.55}
.calg .d.sel{background:var(--accent);color:#fff}
.uph{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.uph button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:12px;text-transform:none;letter-spacing:0}
.upl{display:flex;flex-direction:column;gap:2px}
.upi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 6px;border-radius:9px;cursor:pointer}
.upi:hover{background:var(--chip)}
.upd{flex:none;width:40px;text-align:center;border-radius:8px;background:var(--chip);padding:4px 0}
.upd b{display:block;font-size:15px;line-height:1.1}
.upd span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600}
.upt{min-width:0;flex:1}
.upt b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upt small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upin{flex:none;font-size:11px;color:var(--accent);font-weight:700}
.upnone{font-size:12.5px;color:var(--muted);padding:6px 4px 8px}
/* Ficha: botones de listas y tarjetas */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px}
.pill:hover{border-color:var(--accent)}
.pill .n{background:var(--panel);border-radius:20px;padding:0 8px;font-size:12.5px;min-width:22px;text-align:center}
.pill.alert{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pill.blood{cursor:default}
.pill.blood:hover{border-color:var(--line)}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0 0}
.hc{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px}
.hc dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hc dd{margin:2px 0 0;font-variant-numeric:tabular-nums;word-break:break-all}
.hc .exp{font-size:12px;color:var(--muted)}
.hc .exp.bad{color:var(--danger);font-weight:600}
.hc .exp.warn{color:var(--warn);font-weight:600}
/* Ventana de listas */
.litems{display:flex;flex-direction:column;gap:8px}
.litem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.litem .lt{flex:1;min-width:0}
.litem .lt b{display:block}
.litem .lt span{display:block;font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.litem .la{display:flex;gap:6px;flex:none}
.lform{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lform h4{margin:0;font-size:14px}
@media (max-width:760px){
  aside{position:static;max-height:none;overflow:visible;padding-bottom:0}
  .calwrap{margin-top:8px}
  .calwrap>summary{cursor:pointer}
  .calwrap>summary::after{content:'▾';color:var(--muted);margin-left:8px}
  .calwrap[open]>summary::after{content:'▴'}
  .calwrap>summary .cnt{margin-left:auto}
  .top{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));gap:8px}
  .brand{font-size:16px}
  .brand .long{display:none}
  .sync{padding:6px 10px;font-size:12.5px}
  .sync .txt-long{display:none}
  .layout{grid-template-columns:1fr;padding:12px 16px 50px;gap:14px}
  .lbl,.note{display:none}
  #members{flex-direction:row;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .mem{flex:none;width:auto;padding:6px 12px 6px 6px}
  .mem small{display:none}
  .mem.addm{margin-top:0;padding:6px 14px}
  .card{padding:16px}
  .ph .acts{margin-left:0;width:100%}
  .vh{gap:10px;padding:12px}
  .vd{width:46px;padding-right:8px}
  .vd b{font-size:19px}
  #modal{padding:0}
  .dlg{max-width:none;height:100%;border-radius:0}
  .mh{padding-top:max(16px,env(safe-area-inset-top))}
  .g2{grid-template-columns:1fr}
  .litem{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Historia Clínica<span class="long"> Familiar</span></span></div>
  <button class="sync" id="syncChip" data-act="settings"></button>
  <button class="iconbtn" data-act="settings" title="Ajustes, Dropbox y copias" aria-label="Ajustes">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <input type="file" id="importIn" accept=".zip,application/zip" hidden>
</header>

<div class="layout">
  <aside>
    <p class="lbl">Familia</p>
    <div id="members"></div>
    <details class="calwrap" id="calBox" open><summary>Próximas citas <span class="cnt" id="calCnt">0</span></summary><div id="cal"></div></details>
    <p class="note" id="sideNote"></p>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" hidden></div>

<script>
'use strict';
/* =========================================================
   CONFIGURACIÓN OPCIONAL
   Si escribes aquí la "App key" de tu app de Dropbox, no tendrás
   que introducirla a mano en cada dispositivo.
   ========================================================= */
const DEFAULT_APP_KEY='zx2ve0jubhjnkl3';

/* ---------- Constantes ---------- */
const SPECS=['Medicina de familia','Pediatría','Cardiología','Dermatología','Ginecología y obstetricia','Traumatología','Oftalmología','Otorrinolaringología','Neurología','Aparato digestivo','Endocrinología','Urología','Neumología','Psiquiatría','Psicología','Alergología','Reumatología','Oncología','Hematología','Nefrología','Cirugía general','Odontología','Fisioterapia','Nutrición','Urgencias','Análisis clínicos','Radiología'];
const CATS=[{k:'Informe',c:'#2563eb'},{k:'Análisis',c:'#7c3aed'},{k:'Receta',c:'#059669'},{k:'Prueba / Imagen',c:'#d97706'},{k:'Justificante',c:'#0891b2'},{k:'Otro',c:'#64748b'}];

const BLOOD=['','0+','0−','A+','A−','B+','B−','AB+','AB−'];

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(APP_ID,2);
  r.onupgradeneeded=e=>{
    const d=r.result,t=r.transaction;
    for(const s of ['members','visits','files','blobs'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
    if(e.oldVersion===1){ // migración desde la primera versión: separar los archivos de sus datos
      const fs=t.objectStore('files'),bs=t.objectStore('blobs');
      fs.openCursor().onsuccess=ev=>{const c=ev.target.result;if(!c)return;const v=c.value;if(v.blob){bs.put({id:v.id,blob:v.blob});delete v.blob}v.updated=v.updated||Date.now();v.uploaded=false;c.update(v);c.continue()};
    }
  };
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('Cierra las demás pestañas donde tengas abierta la app y recarga.'));
})}
function run(stores,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(stores,mode);let out;try{out=fn(t)}catch(e){rej(e);return}t.oncomplete=()=>res(out&&typeof out==='object'&&'result' in out?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Operación cancelada'))})}
const getAll=s=>run(s,'readonly',t=>t.objectStore(s).getAll());
const putMany=(s,arr)=>arr.length?run(s,'readwrite',t=>{const st=t.objectStore(s);arr.forEach(v=>st.put(v))}):Promise.resolve();
const delMany=(s,ids)=>ids.length?run(s,'readwrite',t=>{const st=t.objectStore(s);ids.forEach(id=>st.delete(id))}):Promise.resolve();
const getMeta=k=>run('meta','readonly',t=>t.objectStore('meta').get(k));
const setMeta=(k,v)=>run('meta','readwrite',t=>{t.objectStore('meta').put(v,k)});
function errMsg(e){return e&&e.name==='QuotaExceededError'?'No queda espacio de almacenamiento en este dispositivo.':(e&&e.message)||String(e)}
const fileRec=f=>{const o={};FILE_KEYS.forEach(k=>{if(f[k]!==undefined)o[k]=f[k]});o.uploaded=!!f.uploaded;return o};

/* Registrar un cambio local y lanzar la sincronización */

async function tombstone(kind,ids){
  const now=Date.now(),pend=(await getMeta('pendingDel'))||[];
  for(const id of ids){
    S.tombs[id]=now;
    if(kind==='files'){const f=S.files.find(x=>x.id===id);if(f&&f.uploaded&&f.path)pend.push(f.path);S.blobs.delete(id)}
  }
  await setMeta('tombs',S.tombs);await setMeta('pendingDel',pend);
  await delMany(kind,ids);if(kind==='files')await delMany('blobs',ids);
}

const DBX_API='https://api.dropboxapi.com',DBX_CONTENT='https://content.dropboxapi.com';
const hdrArg=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
class DbxError extends Error{constructor(status,summary){super(summary||('Error HTTP '+status));this.status=status;this.summary=summary||''}}
const saveAuth=()=>setMeta('auth',{...AUTH});
function dbxErrText(e){
  if(!e)return 'Error desconocido';
  if(e instanceof TypeError)return 'No hay conexión con Dropbox.';
  if(e.summary==='not_connected')return 'Dropbox no está conectado.';
  if(e.status===401)return 'La conexión con Dropbox ha caducado. Vuelve a conectar.';
  if(e.status===400&&/scope|missing_scope/.test(e.summary))return 'Faltan permisos en tu app de Dropbox (files.content.read y files.content.write). Revísalos y vuelve a conectar.';
  if(/insufficient_space/.test(e.summary))return 'Tu Dropbox no tiene espacio suficiente.';
  if(e.status===429)return 'Dropbox pide esperar un momento. Se reintentará.';
  return e.summary||e.message||String(e);
}
async function getToken(force){
  if(!AUTH.refresh)throw new DbxError(0,'not_connected');
  if(!force&&AUTH.access&&AUTH.exp>Date.now()+60000)return AUTH.access;
  const r=await fetch(DBX_API+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:AUTH.refresh,client_id:AUTH.appKey})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(j.error==='invalid_grant'){AUTH.refresh='';AUTH.access='';await saveAuth()}throw new DbxError(401,j.error_description||j.error||'token')}
  AUTH.access=j.access_token;AUTH.exp=Date.now()+(j.expires_in||14400)*1000;await saveAuth();return AUTH.access;
}
async function dbxFetch(url,opts,retry=true){
  const tok=await getToken();
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){await getToken(true);return dbxFetch(url,opts,false)}
  if(!r.ok){let s='';try{const t=await r.text();try{s=JSON.parse(t).error_summary||t}catch(_){s=t}}catch(_){}throw new DbxError(r.status,String(s).slice(0,300))}
  return r;
}
async function rpc(ep,arg){const o={method:'POST'};if(arg!==undefined){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(arg)}const r=await dbxFetch(DBX_API+'/2/'+ep,o);const t=await r.text();return t?JSON.parse(t):null}
async function dbxUpload(path,data,mode){const r=await dbxFetch(DBX_CONTENT+'/2/files/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','Dropbox-API-Arg':hdrArg({path,mode:mode||'overwrite',autorename:false,mute:true})},body:data});return r.json()}
async function dbxDownload(path){
  try{const r=await dbxFetch(DBX_CONTENT+'/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':hdrArg({path})}});let meta={};try{meta=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}')}catch(_){}return {blob:await r.blob(),meta}}
  catch(e){if(e.status===409&&/not_found/.test(e.summary))return null;throw e}
}
async function dbxMeta(path){try{return await rpc('files/get_metadata',{path})}catch(e){if(e.status===409&&/not_found/.test(e.summary))return null;throw e}}

/* --- Conexión (OAuth PKCE, el usuario copia y pega el código) --- */
const b64url=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function authUrl(appKey){
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador no permite conectar de forma segura. Abre la app desde su dirección https://');
  const arr=new Uint8Array(48);crypto.getRandomValues(arr);const ver=b64url(arr);
  const ch=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver))));
  await setMeta('pkce',ver);
  return 'https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:appKey,response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline'});
}
async function exchangeCode(code){
  const ver=await getMeta('pkce');
  if(!ver)throw new Error('Pulsa primero "Abrir Dropbox para autorizar".');
  const r=await fetch(DBX_API+'/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',code,code_verifier:ver,client_id:AUTH.appKey})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error==='invalid_grant'?'El código no es válido o ya se usó. Repite el paso 2 para obtener uno nuevo.':(j.error_description||j.error||'No se pudo conectar'));
  if(!j.refresh_token)throw new Error('Dropbox no devolvió un permiso permanente. Repite el paso 2.');
  AUTH.refresh=j.refresh_token;AUTH.access=j.access_token;AUTH.exp=Date.now()+(j.expires_in||14400)*1000;
  try{const a=await rpc('users/get_current_account');AUTH.account={name:a.name&&a.name.display_name,email:a.email}}catch(_){AUTH.account=null}
  await saveAuth();await setMeta('pkce',null);
}

/* --- Sincronización --- */
let syncing=false,syncAgain=false,syncTimer=null,prefetching=false;
function scheduleSync(ms=1500){if(!AUTH.refresh)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),ms)}
function setSync(state,msg=''){SYNC.state=state;SYNC.msg=msg;renderSync();if($('#setBody'))renderSettings()}
const stable=v=>Array.isArray(v)?'['+v.map(stable).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v);
function canon(d){ // forma normalizada para comparar local y remoto
  const sortId=a=>(a||[]).slice().sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0);
  return stable({members:sortId(d.members),visits:sortId(d.visits),files:sortId(d.files).map(f=>{const o={};FILE_KEYS.forEach(k=>{if(f[k]!==undefined)o[k]=f[k]});return o}),tombs:d.tombs||{}});
}
const localRemoteView=()=>({members:S.members,visits:S.visits,files:S.files.filter(f=>f.uploaded&&f.path).map(f=>{const o=fileRec(f);delete o.uploaded;return o}),tombs:S.tombs});
async function applyRemote(remote){
  if(!remote)return false;
  let changed=false;
  for(const [id,ts] of Object.entries(remote.tombs||{}))if(!(S.tombs[id]>=ts)){S.tombs[id]=ts;changed=true}
  const puts={members:[],visits:[],files:[]},dels={members:[],visits:[],files:[]};
  for(const k of ['members','visits','files']){
    const map=new Map(S[k].map(x=>[x.id,x]));
    for(const r of remote[k]||[]){
      if(S.tombs[r.id]>=(r.updated||0))continue;
      const l=map.get(r.id);
      if(!l||(r.updated||0)>(l.updated||0)){const rec=k==='files'?{...fileRec(r),uploaded:true}:r;map.set(r.id,rec);puts[k].push(rec);changed=true}
    }
    for(const [id,x] of map)if(S.tombs[id]>=(x.updated||0)){map.delete(id);dels[k].push(id);changed=true}
    S[k]=[...map.values()];
  }
  dels.files.forEach(id=>S.blobs.delete(id));
  for(const k of ['members','visits','files']){await putMany(k,puts[k]);await delMany(k,dels[k])}
  await delMany('blobs',dels.files);await setMeta('tombs',S.tombs);
  return changed;
}
function blobPath(f){
  const v=S.visits.find(x=>x.id===f.visitId)||{},m=S.members.find(x=>x.id===(v.memberId||f.memberId))||{};
  return `/Documentos/${safe(m.name||'Sin_familiar')}/${v.date||'sin-fecha'}_${safe(v.specialty||'Visita')}/${safe(f.category)}_${safe(stripExt(f.name))}_${String(f.id).replace(/-/g,'').slice(0,6)}${extOf(f.name,f.mime)}`;
}
async function uploadPendingBlobs(){
  for(const f of S.files.filter(x=>!x.uploaded)){
    const b=S.blobs.get(f.id);if(!b)continue;
    const path=f.path||blobPath(f);
    await dbxUpload(path,b,'overwrite');
    const cur=S.files.find(x=>x.id===f.id);if(!cur)continue;
    cur.path=path;cur.uploaded=true;await putMany('files',[cur]);
  }
}
async function processPendingDeletes(){
  let pend=(await getMeta('pendingDel'))||[];
  for(const p of pend.slice()){
    try{await rpc('files/delete_v2',{path:p})}catch(e){if(!(e.status===409))throw e}
    pend=pend.filter(x=>x!==p);await setMeta('pendingDel',pend);
  }
}
async function sync(manual){
  if(!AUTH.refresh){setSync('off');return}
  if(syncing){syncAgain=true;return}
  if(!navigator.onLine){setSync('pending','Sin conexión');return}
  syncing=true;setSync('syncing');
  try{
    for(let attempt=0;;attempt++){
      await uploadPendingBlobs();
      await processPendingDeletes();
      const dirty=ls.get('hcf_dirty')==='1',stamp=changeN;
      const meta=await dbxMeta(REMOTE_JSON);
      if(!manual&&!dirty&&meta&&meta.rev===SYNC.rev)break;
      let remote=null,rev=null;
      if(meta){const d=await dbxDownload(REMOTE_JSON);if(d){remote=JSON.parse(await d.blob.text());rev=d.meta.rev||meta.rev}}
      if(remote&&remote.app!==APP_ID)throw new Error('El archivo datos.json de Dropbox no pertenece a esta app.');
      const changed=await applyRemote(remote);
      if(changed)render();
      const local=localRemoteView();
      if(!remote||canon(local)!==canon(remote)){
        const body=JSON.stringify({app:APP_ID,version:2,savedAt:new Date().toISOString(),...local});
        try{const res=await dbxUpload(REMOTE_JSON,new Blob([body],{type:'application/json'}),rev?{'.tag':'update',update:rev}:{'.tag':'add'});SYNC.rev=res.rev}
        catch(e){if(e.status===409&&/conflict/.test(e.summary)&&attempt<4)continue;throw e}
        uploadSummary().catch(()=>{});
      }else SYNC.rev=rev;
      if(changeN===stamp)ls.set('hcf_dirty','0');
      break;
    }
    SYNC.last=Date.now();await setMeta('syncInfo',{rev:SYNC.rev,last:SYNC.last});
    setSync(ls.get('hcf_dirty')==='1'?'pending':'ok');
    if(!IOS)prefetchBlobs();
  }catch(e){console.error(e);setSync(AUTH.refresh?'error':'off',dbxErrText(e))}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(300)}}
}
async function uploadSummary(){
  const pathOf={};S.files.forEach(f=>{if(f.path)pathOf[f.id]=f.path.replace(/^\//,'')});
  await dbxUpload(REMOTE_SUMMARY,new Blob([buildSummary(pathOf,'Los enlaces funcionan desde la carpeta de Dropbox sincronizada en tu ordenador.')],{type:'text/html'}),'overwrite');
}
async function fetchBlob(f){
  const d=await dbxDownload(f.path);if(!d)throw new Error('El documento no está en Dropbox.');
  const b=new Blob([d.blob],{type:f.mime||d.blob.type||'application/octet-stream'});
  S.blobs.set(f.id,b);await putMany('blobs',[{id:f.id,blob:b}]);return b;
}
async function prefetchBlobs(){ // en PC guarda copia local de los documentos para verlos sin conexión
  if(prefetching)return;prefetching=true;
  try{for(const f of S.files.filter(x=>x.uploaded&&x.path&&!S.blobs.has(x.id)))await fetchBlob(f)}catch(e){console.warn(e)}finally{prefetching=false}
}

function render(){renderSide();renderCal();renderMain();renderSync();if($('#listBody'))renderListModal()}
function renderSync(){
  const el=$('#syncChip');let cls='sync',h='';
  const dirty=ls.get('hcf_dirty')==='1';
  if(!AUTH.refresh){h='<span class="dot"></span>Sin Dropbox';}
  else if(SYNC.state==='syncing'){h='<span class="spin"></span><span class="txt-long">Sincronizando…</span>';}
  else if(SYNC.state==='error'){cls+=' error';h='<span class="dot"></span>Error<span class="txt-long">&nbsp;de sincronización</span>';}
  else if(SYNC.state==='pending'||dirty){cls+=' pending';h='<span class="dot"></span>Pendiente<span class="txt-long">&nbsp;de sincronizar</span>';}
  else{cls+=' ok';h=`<span class="dot"></span>Sincronizado${SYNC.last?`<span class="txt-long">&nbsp;· ${hhmm(SYNC.last)}</span>`:''}`;}
  el.className=cls;el.innerHTML=h;el.title=SYNC.msg||'';
  const n=$('#sideNote');
  if(n)n.innerHTML=AUTH.refresh?'Los datos se sincronizan automáticamente con tu Dropbox y con tus otros dispositivos.':'Ahora mismo los datos solo están en este dispositivo. Conecta Dropbox en <b>Ajustes</b> para sincronizarlos con el iPhone o el PC.';
}
function renderSide(){
  const cnt=id=>S.visits.filter(v=>v.memberId===id).length;
  const allIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M14.5 14.6c.8-.4 1.6-.6 2.5-.6 2.2 0 3.7 1.5 4 4"/></svg>';
  let h='';
  if(S.members.length)h+=`<button class="mem ${S.sel==='all'?'on':''}" data-act="sel" data-id="all"><span class="av all">${allIcon}</span><span class="mi"><b>Toda la familia</b><small>${S.visits.length} visita${S.visits.length===1?'':'s'}</small></span></button>`;

function renderCal(){

  let g=['L','M','X','J','V','S','D'].map(d=>`<span class="wd">${d}</span>`).join('');

function matches(v){
  if(!S.q)return true;
  const q=S.q.toLowerCase();
  const docs=S.files.filter(f=>f.visitId===v.id).map(f=>f.name+' '+f.category).join(' ');
  const mm=S.members.find(x=>x.id===v.memberId);
  return [v.specialty,v.doctor,v.center,v.reason,v.diagnosis,v.treatment,v.notes,docs,mm&&mm.name].join(' ').toLowerCase().includes(q);
}
function renderList(){
  const el=$('#visitList');if(!el)return;

  openModal(`<div class="wrap"><header class="mh"><h2 id="listTitle"></h2><button type="button" class="x" data-act="closeModal" aria-label="Cerrar">×</button></header><div class="mb" id="listBody"></div><footer class="mf"><span class="sp"></span><button class="btn" data-act="closeModal">Cerrar</button></footer></div>`);
  renderListModal();
}
function renderListModal(){
  const el=$('#listBody');if(!el||!listEdit)return;
  const m=S.members.find(x=>x.id===listEdit.mid);if(!m){closeModal();return}
  const K=KINDS[listEdit.kind],list=getList(m,listEdit.kind),ed=list.find(x=>x.id===listEdit.itemId)||{};
  $('#listTitle').textContent=`${K.title} · ${m.name}`;
  el.innerHTML=`<div class="litems">${list.length?list.map(it=>`<div class="litem"><div class="lt"><b>${esc(it.name)}</b>${it.detail?`<span>${esc(K.f2)}: ${esc(it.detail)}</span>`:''}${it.notes?`<span>${esc(it.notes)}</span>`:''}</div><div class="la"><button class="btn sm" data-act="listEditItem" data-id="${esc(it.id)}">Editar</button><button class="btn sm ghost danger" data-act="listDelItem" data-id="${esc(it.id)}">Borrar</button></div></div>`).join(''):`<p class="muted" style="margin:0">${K.empty}</p>`}</div>
  <form class="lform" id="lf"><h4>${listEdit.itemId?'Editar '+K.one:'Añadir '+K.one}</h4>
    <div class="g2"><label>${K.f1} *<input name="name" required value="${esc(ed.name||'')}" placeholder="${esc(K.ph1)}" autocomplete="off"></label>
    <label>${K.f2}<input name="detail" value="${esc(ed.detail||'')}" placeholder="${esc(K.ph2)}" autocomplete="off"></label></div>
    <label>${K.f3}<textarea name="notes" rows="2">${esc(ed.notes||'')}</textarea></label>
    <div class="row" style="margin-top:0">${listEdit.itemId?'<button type="button" class="btn" data-act="listCancel">Cancelar edición</button>':''}<span class="sp"></span><button class="btn primary" type="submit">${listEdit.itemId?'Guardar cambios':'+ Añadir'}</button></div></form>`;
}
async function saveList(mid,kind,list){
  const m=S.members.find(x=>x.id===mid);if(!m)return false;
  const K=KINDS[kind],rec={...m,[K.field]:list,updated:Date.now()};delete rec[K.legacy];
  try{await putMany('members',[rec])}catch(e){alert('No se pudo guardar: '+errMsg(e));return false}
  S.members=S.members.map(x=>x.id===mid?rec:x);markChange();renderMain();return true;
}
async function submitListItem(form){
  const fd=Object.fromEntries(new FormData(form));for(const k in fd)fd[k]=String(fd[k]).trim();
  if(!fd.name||!listEdit)return;
  const {mid,kind,itemId}=listEdit,m=S.members.find(x=>x.id===mid);if(!m)return;
  const list=getList(m,kind).map(x=>x.id.startsWith('legacy')?{...x,id:uid()}:x);
  const legacyIdx=itemId&&itemId.startsWith('legacy')?+itemId.slice(6):-1;
  let out;
  if(itemId)out=list.map((x,i)=>(x.id===itemId||i===legacyIdx)?{...x,...fd}:x);
  else out=list.concat({id:uid(),...fd});
  if(await saveList(mid,kind,out)){listEdit.itemId=null;renderListModal();toast(itemId?'Cambios guardados':'Añadido')}
}

   GUARDAR / BORRAR

async function saveMember(form){
  const fd=Object.fromEntries(new FormData(form));for(const k in fd)fd[k]=String(fd[k]).trim();
  if(!fd.name)return;
  const id=form.dataset.id||uid(),ex=S.members.find(x=>x.id===id);
  const rec={...(ex||{}),...fd,id,created:ex?ex.created:Date.now(),updated:Date.now()};
  try{await putMany('members',[rec])}catch(e){alert('No se pudo guardar: '+errMsg(e));return}
  S.members=S.members.filter(x=>x.id!==id).concat(rec);S.sel=id;
  closeModal();markChange();render();toast(ex?'Ficha actualizada':'Familiar añadido');
}
async function saveVisit(form){
  const fd=Object.fromEntries(new FormData(form));for(const k in fd)fd[k]=String(fd[k]).trim();
  if(!fd.memberId||!fd.date||!fd.specialty)return;
  const ex=S.visits.find(x=>x.id===draft.id),now=Date.now();
  const rec={...(ex||{}),...fd,id:draft.id,created:ex?ex.created:now,updated:now};
  const recs=draft.docs.map(d=>{const cur=S.files.find(x=>x.id===d.id)||{};return {id:d.id,visitId:rec.id,memberId:rec.memberId,category:d.category,name:d.name,mime:d.mime,size:d.size,added:d.added,updated:now,path:cur.path||d.path,uploaded:!!(cur.uploaded||d.uploaded)}});
  const newBlobs=draft.docs.filter(d=>d.isNew).map(d=>({id:d.id,blob:d.blob}));
  const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Guardando…';
  try{
    await putMany('blobs',newBlobs);
    await putMany('visits',[rec]);
    await putMany('files',recs);
    if(draft.removed.length)await tombstone('files',draft.removed);
  }catch(e){alert('No se pudo guardar: '+errMsg(e));btn.disabled=false;btn.textContent='Guardar visita';return}
  newBlobs.forEach(b=>S.blobs.set(b.id,b.blob));
  S.visits=S.visits.filter(x=>x.id!==rec.id).concat(rec);
  S.files=S.files.filter(f=>f.visitId!==rec.id&&!draft.removed.includes(f.id)).concat(recs);
  if(S.sel!=='all')S.sel=rec.memberId;
  S.open.add(rec.id);closeModal();markChange();render();toast(ex?'Visita actualizada':'Visita guardada');
}
async function deleteVisit(id){
  const v=S.visits.find(x=>x.id===id);if(!v)return;
  const files=S.files.filter(f=>f.visitId===id);
  if(!confirm(`¿Eliminar la visita de ${v.specialty} del ${fmt(v.date)}${files.length?` y sus ${files.length} documento(s)`:''}?\nSe borrará también en tus otros dispositivos y en Dropbox. No se puede deshacer.`))return;
  try{await tombstone('files',files.map(f=>f.id));await tombstone('visits',[id])}catch(e){alert(errMsg(e));return}
  S.files=S.files.filter(f=>f.visitId!==id);S.visits=S.visits.filter(x=>x.id!==id);markChange();render();toast('Visita eliminada');
}
async function deleteMember(id){
  const m=S.members.find(x=>x.id===id);if(!m)return;
  const vs=S.visits.filter(v=>v.memberId===id),vids=new Set(vs.map(v=>v.id)),fs=S.files.filter(f=>vids.has(f.visitId));
  if(!confirm(`¿Eliminar a ${m.name} junto con ${vs.length} visita(s) y ${fs.length} documento(s)?\nSe borrará también en tus otros dispositivos y en Dropbox. No se puede deshacer.`))return;
  try{await tombstone('files',fs.map(f=>f.id));await tombstone('visits',vs.map(v=>v.id));await tombstone('members',[id])}catch(e){alert(errMsg(e));return}
  S.files=S.files.filter(f=>!vids.has(f.visitId));S.visits=S.visits.filter(v=>v.memberId!==id);S.members=S.members.filter(x=>x.id!==id);S.sel='all';
  closeModal();markChange();render();toast('Familiar eliminado');
}

function openBlob(blob,name){
  const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');
  if(!w)downloadBlob(blob,name);
  setTimeout(()=>URL.revokeObjectURL(url),300000);
}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000)}
function showLink(url,name){openModal(`<div class="wrap"><header class="mh"><h2>Documento listo</h2><button type="button" class="x" data-act="closeModal">×</button></header><div class="mb"><p>${esc(name)}</p><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Abrir documento</a></div></div>`)}
function viewFile(f){
  const b=S.blobs.get(f.id);
  const online=AUTH.refresh&&navigator.onLine&&f.uploaded&&f.path;
  if(b&&(!IOS||!online)){openBlob(b,f.name);return}
  if(!online){toast(f.uploaded?'Sin conexión: este documento está en Dropbox.':'Este documento aún no se ha sincronizado desde el otro dispositivo.',3500);return}
  const w=window.open('','_blank');
  try{if(w)w.document.write('<p style="font:16px system-ui;padding:24px">Abriendo documento…</p>')}catch(_){}
  rpc('files/get_temporary_link',{path:f.path}).then(r=>{if(w&&!w.closed)w.location.href=r.link;else showLink(r.link,f.name)})
    .catch(e=>{if(w)w.close();toast('No se pudo abrir: '+dbxErrText(e),4000)});
}
async function dlFile(f){
  try{let b=S.blobs.get(f.id);if(!b){if(!(AUTH.refresh&&f.uploaded))throw new Error('Documento no disponible.');toast('Descargando…');b=await fetchBlob(f)}downloadBlob(b,f.name)}
  catch(e){toast('No se pudo descargar: '+dbxErrText(e),4000)}
}

/* =========================================================
   ZIP
   ========================================================= */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(entries){ // [{path, data:Uint8Array}] -> Blob (sin compresión, nombres UTF-8)
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const e of entries){
    const name=enc.encode(e.path),crc=crc32(e.data),size=e.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,e.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+size;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}
async function readZip(buf){ // Uint8Array -> {ruta: Uint8Array}
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let eo=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break}}
  if(eo<0)throw new Error('El archivo no es un ZIP válido.');
  const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const dec=new TextDecoder(),out={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP dañado.');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(buf.subarray(p+46,p+46+nl));
    const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    let data=buf.subarray(start,start+csize);
    if(!name.endsWith('/')){
      if(method===8){
        if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede leer ZIP comprimidos. Usa el .zip original descargado desde la app.');
        data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      }else if(method!==0)throw new Error('Formato de compresión no soportado.');
      out[name]=data;
    }
    p+=46+nl+el+cl;
  }
  return out;
}

/* =========================================================
   COPIA .ZIP (EXPORTAR / IMPORTAR)
   ========================================================= */
async function doExport(){
  if(!S.members.length){toast('Todavía no hay datos que exportar.');return}
  try{
    const missing=S.files.filter(f=>!S.blobs.has(f.id));
    if(missing.length){
      if(!AUTH.refresh||!navigator.onLine)throw new Error(`Faltan ${missing.length} documento(s) en este dispositivo y no hay conexión con Dropbox.`);
      for(let i=0;i<missing.length;i++){toast(`Descargando documentos de Dropbox ${i+1}/${missing.length}…`,1500);if(missing[i].uploaded)await fetchBlob(missing[i])}
    }
    toast('Preparando la copia…',1800);
    const enc=new TextEncoder(),entries=[],used=new Set(),pathOf={};
    const mBy=Object.fromEntries(S.members.map(m=>[m.id,m])),vBy=Object.fromEntries(S.visits.map(v=>[v.id,v]));
    const files=S.files.filter(f=>vBy[f.visitId]&&S.blobs.has(f.id));
    for(const f of files){
      const v=vBy[f.visitId],m=mBy[v.memberId];
      const folder=`${safe(m?m.name:'Sin_familiar')}/${v.date||'sin-fecha'}_${safe(v.specialty||'Visita')}`;
      const ext=extOf(f.name,f.mime),base=`${safe(f.category)}_${safe(stripExt(f.name))}`;
      let path=`${folder}/${base}${ext}`,i=2;
      while(used.has(path.toLowerCase()))path=`${folder}/${base}_${i++}${ext}`;
      used.add(path.toLowerCase());pathOf[f.id]=path;
      entries.push({path,data:new Uint8Array(await S.blobs.get(f.id).arrayBuffer())});
    }
    const data={app:APP_ID,version:2,exportedAt:new Date().toISOString(),members:S.members,visits:S.visits,tombs:S.tombs,
      files:files.map(f=>{const o=fileRec(f);delete o.uploaded;o.zipPath=pathOf[f.id];return o})};
    entries.unshift({path:'Resumen.html',data:enc.encode(buildSummary(pathOf,'Los enlaces a documentos funcionan tras descomprimir el ZIP.'))});
    entries.unshift({path:ZIP_DATA,data:enc.encode(JSON.stringify(data,null,1))});
    const d=new Date();
    downloadBlob(makeZip(entries),`HistoriaClinica_Familiar_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.zip`);
    toast('Copia descargada.',3000);
  }catch(e){alert('No se pudo crear la copia: '+dbxErrText(e))}
}
function buildSummary(pathOf,linkNote){
  const rows=[];
  const fld=(l,v)=>v?`<dt>${l}</dt><dd>${esc(v)}</dd>`:'';
  for(const m of S.members.slice().sort((a,b)=>byName(a.name,b.name))){
    const vs=S.visits.filter(v=>v.memberId===m.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    rows.push(`<h2>${esc(m.name)}${m.relation?` <small>(${esc(m.relation)})</small>`:''}</h2><dl class="p">${fld('Fecha de nacimiento',fmt(m.birthdate))}${fld('Grupo sanguíneo',m.blood)}${['allergies','conds','meds'].map(k=>fld(KINDS[k].title,getList(m,k).map(it=>'• '+[it.name,it.detail,it.notes].filter(Boolean).join(' — ')).join('\n'))).join('')}${CARDS.map(c=>fld(c.l,m[c.k]?m[c.k]+(c.exp&&m[c.exp]?' (caduca '+fmt(m[c.exp])+')':''):'')).join('')}${fld('Otra tarjeta / seguro',m.insurance)}${fld('Notas',m.notes)}</dl>`);
    if(!vs.length)rows.push('<p class="m">Sin visitas registradas.</p>');
    for(const v of vs){
      const docs=S.files.filter(f=>f.visitId===v.id);
      rows.push(`<div class="v"><div class="h">${fmt(v.date)} · ${esc(v.specialty)}</div><div class="m">${esc([v.doctor,v.center].filter(Boolean).join(' · '))}</div><dl>${fld('Motivo',v.reason)}${fld('Diagnóstico',v.diagnosis)}${fld('Tratamiento / medicación',v.treatment)}${fld('Próxima cita',fmt(v.nextAppointment))}${fld('Notas',v.notes)}</dl>${docs.length?`<dt>Documentos</dt><ul>${docs.map(f=>`<li>${esc(f.category)}: ${pathOf[f.id]?`<a href="${esc(encodeURI(pathOf[f.id]))}">${esc(f.name)}</a>`:esc(f.name)}</li>`).join('')}</ul>`:''}</div>`);
    }
  }
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historia Clínica Familiar — Resumen</title><style>body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b2a30;background:#fff;max-width:900px;margin:24px auto;padding:0 16px}h1{font-size:22px;margin-bottom:0}h2{margin-top:36px;border-bottom:2px solid #0f766e;padding-bottom:4px}h2 small{font-weight:400;color:#5f7178;font-size:14px}.v{border:1px solid #dde4e7;border-radius:8px;padding:10px 14px;margin:10px 0;break-inside:avoid}.h{font-weight:700}.m{color:#5f7178}dl{margin:4px 0}dt{font-weight:700;color:#5f7178;font-size:11.5px;text-transform:uppercase;margin-top:6px}dd{margin:0;white-space:pre-wrap}ul{margin:2px 0;padding-left:20px}a{color:#0f766e}</style></head><body><h1>Historia Clínica Familiar</h1><p class="m">Resumen generado el ${dmy(Date.now())} a las ${hhmm(Date.now())}. ${esc(linkNote)}</p>${rows.join('')}</body></html>`;
}
async function doImport(file){
  try{
    const zip=await readZip(new Uint8Array(await file.arrayBuffer()));
    const key=Object.keys(zip).find(k=>k===ZIP_DATA||k.endsWith('/'+ZIP_DATA));
    if(!key)throw new Error(`El ZIP no contiene "${ZIP_DATA}". Usa un archivo descargado desde esta app.`);
    const prefix=key.slice(0,key.length-ZIP_DATA.length);
    const data=JSON.parse(new TextDecoder().decode(zip[key]));
    if(data.app!==APP_ID||!Array.isArray(data.members))throw new Error('El archivo no es una copia de esta app.');
    const when=data.exportedAt?new Date(data.exportedAt).toLocaleString('es-ES'):'fecha desconocida';
    if(!confirm(`Importar la copia del ${when}:\n${data.members.length} familiares, ${(data.visits||[]).length} visitas, ${(data.files||[]).length} documentos.\n\nSe añadirá lo que falte y se actualizará lo que sea más reciente en la copia. No se borra nada de lo actual.\n\n¿Continuar?`))return;
    let missing=0,added=0;const newBlobs=[],put={members:[],visits:[],files:[]};
    for(const k of ['members','visits']){
      for(const r of data[k]||[]){const l=S[k].find(x=>x.id===r.id);const rec={...r,updated:r.updated||1};if(S.tombs[r.id]>=rec.updated)continue;if(!l||rec.updated>(l.updated||0)){put[k].push(rec);added++}}
    }
    for(const f of data.files||[]){
      const zp=f.zipPath||f.path,u=zip[prefix+zp];
      const l=S.files.find(x=>x.id===f.id);const upd=f.updated||1;
      if(S.tombs[f.id]>=upd||(l&&(l.updated||0)>=upd))continue;
      if(!u){missing++;continue}
      const rec=fileRec({...f,updated:upd});delete rec.path;rec.uploaded=false;
      put.files.push(rec);newBlobs.push({id:f.id,blob:new Blob([u],{type:f.mime||'application/octet-stream'})});added++;
    }
    await putMany('blobs',newBlobs);
    for(const k of ['members','visits','files'])await putMany(k,put[k]);
    newBlobs.forEach(b=>S.blobs.set(b.id,b.blob));
    for(const k of ['members','visits','files']){const ids=new Set(put[k].map(x=>x.id));S[k]=S[k].filter(x=>!ids.has(x.id)).concat(put[k])}
    S.sel='all';S.q='';S.spec='';
    markChange();render();if($('#setBody'))renderSettings();
    toast(added?`Importado: ${added} elemento(s) nuevos o actualizados.`:'No había nada nuevo que importar.',4500);
    if(missing)alert(`Atención: ${missing} documento(s) no se encontraron dentro del ZIP.`);
  }catch(e){alert('No se pudo importar: '+errMsg(e))}
}

const actions={
  sel:id=>{S.sel=id;S.spec='';render();window.scrollTo({top:0})},
  addMember:()=>memberModal(),
  editMember:id=>memberModal(id),
  delMember:id=>deleteMember(id),
  addVisit:()=>visitModal(),
  editVisit:id=>visitModal(id),
  delVisit:id=>deleteVisit(id),
  toggle:id=>{S.open.has(id)?S.open.delete(id):S.open.add(id);renderList()},
  openFile:id=>{const f=S.files.find(x=>x.id===id);if(f)viewFile(f)},
  dlFile:id=>{const f=S.files.find(x=>x.id===id);if(f)dlFile(f)},
  closeModal:()=>{if(draft&&draft.docs.some(d=>d.isNew)&&!confirm('Hay documentos añadidos sin guardar. ¿Cerrar igualmente?'))return;closeModal()},
  addDoc:cat=>{pendingCat=cat;$('#fileIn').click()},
  openDraft:id=>{const d=draft&&draft.docs.find(x=>x.id===id);if(!d)return;if(d.blob)openBlob(d.blob,d.name);else viewFile(d)},
  rmDraft:id=>{const d=draft.docs.find(x=>x.id===id);if(!d)return;draft.docs=draft.docs.filter(x=>x.id!==id);if(!d.isNew)draft.removed.push(id);renderDraft()},
  settings:()=>settingsModal(),
  syncNow:()=>sync(true),
  openList:id=>{const [mid,kind]=id.split('|');listModal(mid,kind)},
  listEditItem:id=>{listEdit.itemId=id;renderListModal();const i=$('#lf [name=name]');if(i){if(i.scrollIntoView)i.scrollIntoView({block:'center'});if(!IOS)i.focus()}},
  listCancel:()=>{listEdit.itemId=null;renderListModal()},
  listDelItem:async id=>{
    const {mid,kind}=listEdit,m=S.members.find(x=>x.id===mid);if(!m)return;
    const list=getList(m,kind),it=list.find(x=>x.id===id);if(!it||!confirm(`¿Borrar «${it.name}»?`))return;
    const out=list.filter(x=>x.id!==id).map(x=>x.id.startsWith('legacy')?{...x,id:uid()}:x);
    if(await saveList(mid,kind,out)){if(listEdit&&listEdit.itemId===id)listEdit.itemId=null;renderListModal()}
  },
  calPrev:()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--}renderCal()},
  calNext:()=>{CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++}renderCal()},
  calDay:d=>{CAL.day=CAL.day===d?'':d;renderCal()},
  calAll:()=>{CAL.day='';renderCal()},
  goAppt:id=>{
    const v=S.visits.find(x=>x.id===id);if(!v)return;
    S.sel=v.memberId;S.q='';S.spec='';S.open.add(id);renderSide();renderMain();
    const el=document.getElementById('v-'+id);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
  },
  authOpen:async()=>{
    const key=($('#appKey').value||'').trim();
    if(!key){toast('Escribe primero la App key (paso 1).');return}
    const w=window.open('','_blank'); // se abre antes de cualquier espera para que el iPhone no lo bloquee
    AUTH.appKey=key;await saveAuth();
    try{const url=await authUrl(key);if(w&&!w.closed)w.location.href=url;else $('#authLink').innerHTML=`<p><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Ir a Dropbox</a></p>`}
    catch(e){if(w)w.close();toast(errMsg(e),5000)}
  },
  authCode:async(_,btn)=>{
    const code=($('#authCode').value||'').trim(),key=($('#appKey').value||'').trim();
    if(!code){toast('Pega el código que te ha dado Dropbox.');return}
    if(key)AUTH.appKey=key;
    btn.disabled=true;btn.textContent='Conectando…';
    try{await exchangeCode(code);SYNC.msg='';toast('Dropbox conectado. Sincronizando…');ls.set('hcf_dirty','1');renderSettings();renderMain();await sync(true)}
    catch(e){btn.disabled=false;btn.textContent='Conectar';SYNC.msg=errMsg(e);renderSettings()}
  },
  disconnect:async()=>{
    if(!confirm('¿Desconectar Dropbox en este dispositivo?\nLos datos siguen en Dropbox y en tus otros dispositivos. Aquí dejarán de sincronizarse.'))return;
    try{await rpc('auth/token/revoke')}catch(_){}
    AUTH.refresh='';AUTH.access='';AUTH.exp=0;AUTH.account=null;await saveAuth();setSync('off');renderMain();
  },
  export:()=>doExport(),
  import:()=>$('#importIn').click()
};
document.addEventListener('click',e=>{const s=e.target.closest('#calBox>summary');if(s&&window.innerWidth>760)e.preventDefault()},true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=actions[a.dataset.act];if(fn){e.preventDefault();fn(a.dataset.id,a)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='mf')saveMember(e.target);else if(e.target.id==='vf')saveVisit(e.target);else if(e.target.id==='lf')submitListItem(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value.trim();renderList()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='spec'){S.spec=t.value;renderList()}
  else if(t.id==='fileIn'&&draft){for(const f of t.files)draft.docs.push({id:uid(),category:pendingCat,name:f.name||('foto_'+Date.now()+'.jpg'),mime:f.type||'',size:f.size,added:Date.now(),blob:f,isNew:true});t.value='';renderDraft()}
  else if(t.dataset&&t.dataset.draftcat&&draft){const d=draft.docs.find(x=>x.id===t.dataset.draftcat);if(d){d.category=t.value;t.style.setProperty('--c',catColor(t.value))}}
  else if(t.id==='importIn'){const f=t.files[0];t.value='';if(f)doImport(f)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)actions.closeModal()});
let lastVis=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AUTH.refresh&&Date.now()-lastVis>15000){lastVis=Date.now();sync(false)}});
window.addEventListener('online',()=>{if(AUTH.refresh)sync(false)});
window.addEventListener('offline',()=>{if(AUTH.refresh)setSync('pending','Sin conexión')});
setInterval(()=>{if(document.visibilityState==='visible'&&AUTH.refresh&&!$('#vf')&&!$('#mf'))sync(false)},60000);
const setTopH=()=>document.documentElement.style.setProperty('--toph',$('.top').offsetHeight+'px');
window.addEventListener('resize',setTopH);setTopH();
if(window.innerWidth<=760)$('#calBox').open=false;

/* =========================================================
   ARRANQUE
   ========================================================= */
(async()=>{
  try{
    if(!window.indexedDB)throw new Error('Este navegador no permite guardar datos.');
    db=await openDB();
    const [members,visits,files,blobs,tombs,auth,info]=await Promise.all([getAll('members'),getAll('visits'),getAll('files'),getAll('blobs'),getMeta('tombs'),getMeta('auth'),getMeta('syncInfo')]);
    S.members=members;S.visits=visits;S.files=files;S.tombs=tombs||{};
    blobs.forEach(b=>S.blobs.set(b.id,b.blob));
    if(auth)Object.assign(AUTH,auth);
    if(!AUTH.appKey)AUTH.appKey=DEFAULT_APP_KEY;
    if(info){SYNC.rev=info.rev||'';SYNC.last=info.last||0}
    if(files.some(f=>!f.uploaded))ls.set('hcf_dirty','1');
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    render();
    if(AUTH.refresh)sync(false);
  }catch(e){
    $('#main').innerHTML=`<div class="err"><b>No se puede acceder al almacenamiento del navegador.</b><br>${esc(errMsg(e))}<br>Usa Safari, Chrome o Edge sin modo privado / incógnito.</div>`;
  }
})();
</script>
</body>
</html>
